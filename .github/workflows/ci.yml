name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      TF_CPP_MIN_LOG_LEVEL: "3"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.3"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - run: uv pip check
      - run: uv run ruff check .
      - run: uv run gpu-hyperparam-check --smoke
      - run: uv run pytest
      - run: uv build
      - name: Run the documented CPU example
        run: |
          uv run gpu-hyperparam-demo-data
          uv run gpu-hyperparam-train --config examples/cpu.json
          uv run gpu-hyperparam-train --config examples/cpu.json --test --model artifacts/cpu-demo/demo.keras --threshold 0.5 --save-dir artifacts/cpu-evaluation
      - name: Save the CPU example outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-example-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/cpu-demo/
            artifacts/cpu-evaluation/
            examples/cpu.json
            examples/model-small.json
            dist/
